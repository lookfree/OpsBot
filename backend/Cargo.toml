[package]
name = "zwd-opsbot"
version = "0.1.0"
description = "ZWD-OpsBot - Cross-platform Operations Terminal"
authors = ["ZWD Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zwd_opsbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# SSH
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "postgres", "sqlite", "chrono", "json", "tls-native-tls"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono"], optional = true }
oracle = { version = "0.6", optional = true }
odbc-api = { version = "5", optional = true }
clickhouse = { version = "0.13", features = ["native-tls"], optional = true }
reqwest = { version = "0.12", features = ["json", "native-tls"], optional = true }

# Local SQLite (for GPU history storage)
rusqlite = { version = "0.32", features = ["bundled"] }

# Middleware - Message Queue
rdkafka = { version = "0.36", features = ["cmake-build", "ssl-vendored"], optional = true }

# Middleware - Cache/KV Store
# Note: TLS disabled temporarily due to redis 0.27 dependency issues
redis = { version = "0.27", features = ["tokio-comp", "cluster-async"], optional = true }

# Middleware - Search Engine
elasticsearch = { version = "8.5.0-alpha.1", optional = true }
url = { version = "2.5", optional = true }

# Docker
bollard = "0.18"
hyper = "1.4"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
urlencoding = "2.1"
regex = "1.10"

# Encryption (for storing credentials)
ring = "0.17"
base64 = "0.22"

# OS keyring for secure key storage
keyring = "3"

# Connection pooling (for MSSQL)
bb8 = "0.8"

[features]
# Default features: cross-platform pure-Rust dependencies only
# Native dependencies (oracle, dm, kafka) require system libraries and are opt-in
# Note: kafka requires cmake to build rdkafka from source
default = ["mssql", "clickhouse", "redis", "elasticsearch", "kafka"]

# Platform-specific features requiring native libraries
oracle = ["dep:oracle"]      # Requires Oracle Instant Client
dm = ["dep:odbc-api"]        # Requires unixODBC
kafka = ["dep:rdkafka"]      # Requires librdkafka (builds from source with cmake)

# Cross-platform features (pure Rust)
mssql = ["dep:tiberius"]
clickhouse = ["dep:clickhouse", "dep:reqwest"]
redis = ["dep:redis"]
elasticsearch = ["dep:elasticsearch", "dep:url"]

# Linux CI build: includes DM (ODBC) and Kafka (cmake build)
# Does not include Oracle which requires Oracle Instant Client
linux-ci = ["mssql", "clickhouse", "redis", "dm", "kafka", "elasticsearch"]

# All features for full functionality (requires all native libraries)
full = ["oracle", "mssql", "dm", "clickhouse", "kafka", "redis", "elasticsearch"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
